[package]
name = "recallpet"
version = "0.1.0"
description = "RecallPet Phase 0 - local-first macOS clipboard history menu-bar app"
authors = ["RecallPet Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "recallpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "recallpet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-positioner = { version = "=2.3.3", features = ["tray-icon"] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "=0.11.0"
log = "=0.4.33"
env_logger = "=0.11.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
# this feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
